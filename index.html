                                                        <button onClick={() => setTempLanguage('ru')} className={`flex-1 py-2 rounded-lg text-sm ${tempLanguage === 'ru' ? 'bg-[var(--bg-body)] font-medium' : 'text-[var(--text-secondary)]'}`}>Русский</button>
                                                        <button onClick={() => setTempLanguage('da')} className={`flex-1 py-2 rounded-lg text-sm ${tempLanguage === 'da' ? 'bg-[var(--bg-body)] font-medium' : 'text-[var(--text-secondary)]'}`}>Dansk</button>
                                                    </div>
                                                </div>
                                            </div>
                                            <div>
                                                <label className="block text-sm mb-2 font-medium">{t.tabTitleSetting}</label>
                                                <input type="text" value={tempTabTitle} onChange={e => setTempTabTitle(e.target.value)} placeholder={t.tabTitlePlaceholder} className="w-full p-3.5 rounded-xl bg-[var(--bg-input)] border border-[var(--border-color)] focus:outline-none focus:border-[var(--accent-blue)] text-sm" />
                                            </div>
                                        </div>

                                        <div className="h-px bg-[var(--border-color)] opacity-50"></div>

                                        <div className="space-y-4">
                                            <h3 className="text-xs font-bold text-[var(--text-secondary)] uppercase tracking-wider">{t.settingsData}</h3>
                                            <div>
                                                <label className="block text-sm mb-2 font-medium">{t.yourName}</label>
                                                <input type="text" value={tempNickname} onChange={e => setTempNickname(e.target.value)} className="w-full p-3.5 rounded-xl bg-[var(--bg-input)] border border-[var(--border-color)] focus:outline-none focus:border-[var(--accent-blue)] text-sm" />
                                            </div>
                                            <div>
                                                <label className="block text-sm mb-2 font-medium">{t.apiKey}</label>
                                                <input type="password" value={tempApiKey} onChange={e => setTempApiKey(e.target.value)} className="w-full p-3.5 rounded-xl bg-[var(--bg-input)] border border-[var(--border-color)] focus:outline-none focus:border-[var(--accent-blue)] font-mono text-sm" />
                                            </div>
                                        </div>
                                    </div>
                                    <div className="p-6 border-t border-[var(--border-color)] flex justify-between items-center gap-4">
                                        <button onClick={clearAllHistory} className="px-5 py-2.5 text-red-400 bg-red-500/10 hover:bg-red-500/20 rounded-full text-sm font-medium">{t.clearHistory}</button>
                                        <button onClick={saveSettings} className="px-8 py-2.5 bg-[var(--accent-blue)] text-[#000] rounded-full font-medium ml-auto">{t.save}</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {isMemoryModalOpen && (
                            <Modal title={t.systemInstructions} onClose={() => setIsMemoryModalOpen(false)}
                                footer={<>
                                    <button onClick={() => setIsMemoryModalOpen(false)} className="px-6 py-2.5 hover:bg-[var(--hover-bg)] rounded-full font-medium">{t.cancel}</button>
                                    <button onClick={saveMemory} className="px-8 py-2.5 bg-[var(--accent-blue)] text-[#000] rounded-full font-medium">{t.save}</button>
                                </>}>
                                <textarea value={tempSystemInstruction} onChange={e => setTempSystemInstruction(e.target.value)} placeholder={t.sysInstPlaceholder}
                                    className="w-full h-64 p-4 rounded-xl bg-[var(--bg-input)] border border-[var(--border-color)] focus:outline-none focus:border-[var(--accent-blue)] resize-none leading-relaxed" autoFocus />
                                <p className="mt-4 text-sm text-[var(--text-secondary)]">{t.sysInstDescription}</p>
                            </Modal>
                        )}

                        {isWelcomeModalOpen && (
                            <div className="fixed inset-0 bg-black/90 z-[150] flex items-center justify-center p-4">
                                <div className="bg-[var(--bg-surface)] p-8 rounded-3xl w-full max-w-md border border-[var(--border-color)] text-center">
                                    <div className="mb-6"><GeminiIcon className="w-14 h-14 mx-auto animate-pulse" /></div>
                                    <h2 className="text-2xl font-bold mb-2">{t.welcome}</h2>
                                    <p className="text-[var(--text-secondary)] mb-8">{t.askName}</p>
                                    <input type="text" value={nickname} onChange={e => setNickname(e.target.value)} placeholder={t.namePlaceholder}
                                        className="w-full p-4 rounded-xl bg-[var(--bg-input)] border border-[var(--border-color)] focus:outline-none focus:border-[var(--accent-blue)] text-center text-lg mb-6"
                                        onKeyDown={e => e.key === 'Enter' && saveNickname(nickname)} />
                                    <button onClick={() => saveNickname(nickname)} className="w-full py-4 bg-[var(--accent-blue)] text-[#000] rounded-xl font-bold">{t.startChat}</button>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
</body>
</html>
